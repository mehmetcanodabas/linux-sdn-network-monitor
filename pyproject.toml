[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-sdn-network-monitor"
version = "1.0.0"
description = "Linux-based SDN network monitoring and flow configuration using Python and REST APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3"
]

[project.optional-dependencies]
simulator = [
    "Flask>=3.1,<4"
]
test = [
    "pytest>=9,<10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
